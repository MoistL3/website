<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Contact </title>
        <link rel = "stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>The assignment page</h1>
        <p>Feel free to reach out for collaborations, inquiries, or feedback<p>
    </main>

    <form action = "#" method="post">
        <div>
            <label for="Full Name">Full Name:  </label><br>
            <input type="text" name="Full name" id="fullname" placeholder="Enter your first name" required>
        </div>
            <br>
        <div>
            <label for="Email"> Email : </label><br>
            <input type="email" name="email" id="email" placeholder="Enter your Email"  required>
        </div>
        <br>
        <div>
            <label for ="date" > Date :</label><br>
            <input type="date" name="Date" placeholder="Enter a Date" required="false">
        </div>
            <br>
        <div>
                <label>Gender:</label><br>
                <label for="male">Male</label>
                <input type="radio" id="male" name="male" value="male">
                <label for="female">Female</label>
                <input type="radio" id="female" name="gender" value="female">

            </div>
            <br>
            <div>
                <label for="subject" >Subject : </label> <br>
                <select id="subject" name=" subject " required>
                <option>----Select option----</option>
                <option value="general">General Inquiry</option>
                    <option value="project">Project Collaboration</option>
                    <option value="feedback">Feedback</option>
            </div>
            <fieldset>
    <legend>Interests / Services Required:</legend>
    <label><input type="checkbox" name="interests" value="backend"> Backend</label>
    <label><input type="checkbox" name="interests" value="frontend"> Frontend</label>
    <label><input type="checkbox" name="interests" value="design"> UI/UX Design</label>
    <label><input type="checkbox" name="interests" value="database"> Databases</label>
    <label><input type="checkbox" name="interests" value="devops"> DevOps </label>
            </fieldset>



            <br>
            <div>
                <label for="message" >Message :</label><br>
                <textarea rows="5" name="Message" placeholder="Write your message here"  required></textarea>
            </div>
            <br>
        <button type="submit" value="submit you message"> send your message</button>
        
    </form>
    <footer>
        <p>&copy; 2026 Mohamed. All rights reserved.</p>
    </footer>
</body>
